# Draft-gated CI. Draft PRs are skipped; marking a PR "Ready for review"
# (what the land-it skill does) triggers this run, which watch-ci then polls.
# The job name `ci` is the status-check context referenced by branch protection —
# keep them in sync.
#
# provision-repo keeps the `node-only` and `rust-only` blocks the repo's stack needs and deletes
# the other block, markers included. Every stack step is gated on the stack's lockfile or manifest
# existing, so the push that lands this file on an empty repo passes as a no-op instead of failing
# the first run. The first step of each block fails a pull_request that lacks that file, so a PR
# that deletes it cannot pass by skipping everything.
#
# Third-party actions are pinned to a full commit SHA; the comment is the tag it was resolved from.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # Skip draft PRs; push events have no PR object so the condition is true for them.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Runs before any stack gate so it guards every push and PR, lockfile or not.
      - name: Leak guard
        run: node scripts/check-leaks.mjs

      - name: Require the lockfile on pull requests
        if: github.event_name == 'pull_request' && hashFiles('pnpm-lock.yaml') == ''
        run: echo "::error::pnpm-lock.yaml missing" && exit 1

      # Install pnpm BEFORE setup-node so its `cache: pnpm` can find pnpm,
      # and so the Node version below (not the runner's preinstalled one) is used.
      # pnpm/action-setup reads the version from package.json `packageManager`.
      - name: Install pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm lint

      - name: Typecheck
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm typecheck

      - name: Test
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm test

      - name: Build
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm build

